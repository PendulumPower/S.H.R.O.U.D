name: S.H.R.O.U.D Build Pipeline

on:
  push:
    branches: [ "**" ] # Triggers on direct pushes and merges across all branches
  pull_request:
    types: [opened, synchronize, reopened, closed]
  create: # Triggers on new branch or tag creation
  workflow_dispatch:

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Build Step
        run: echo "Compiling S.H.R.O.U.D game files..."

  send-notifications:
    runs-on: ubuntu-latest
    needs: build-game
    if: always() # Ensures notifications run regardless of build outcome
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. PULL REQUEST NOTIFICATIONS
      - name: Discord Notification - Pull Request
        if: github.event_name == 'pull_request'
        uses: niranjanshk27/discord-notify@main
        with:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: "🔀 PR ${{ github.event.action }}: #${{ github.event.number }}"
          CONTENT: |
            **Action:** Pull Request ${{ github.event.action }}
            **Author:** ${{ github.actor }}
            **Source Branch:** `${{ github.event.pull_request.head.ref }}` ➔ `${{ github.event.pull_request.base.ref }}`
            **Build Result:** ${{ needs.build-game.result }}
            
            **PR Title:** ${{ github.event.pull_request.title }}
            **PR Description:**
            ${{ github.event.pull_request.body || 'No description provided.' }}
          EMBEDS: "true"
          RESULT: ${{ needs.build-game.result }}

      # 2. NEW BRANCH CREATION NOTIFICATIONS
      - name: Discord Notification - New Branch
        if: github.event_name == 'create' && github.event.ref_type == 'branch'
        uses: niranjanshk27/discord-notify@main
        with:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: "🌱 New Branch Created: ${{ github.event.ref }}"
          CONTENT: |
            **Action:** New Branch Created
            **Author:** ${{ github.actor }}
            **Branch Name:** `${{ github.event.ref }}`
            **Base Ref:** `${{ github.event.master_branch }}`
          EMBEDS: "true"
          RESULT: "success"

      # 3. PUSH / MERGE NOTIFICATIONS
      - name: Discord Notification - Push or Merge
        if: github.event_name == 'push'
        uses: niranjanshk27/discord-notify@main
        with:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: "${{ needs.build-game.result == 'success' && '🟢' || '🔴' }} Commit Pushed to ${{ github.ref_name }}"
          CONTENT: |
            **Action:** ${{ contains(github.event.head_commit.message, 'Merge pull request') && 'Merged Pull Request' || 'Code Push' }}
            **Author:** ${{ github.actor }}
            **Branch:** `${{ github.ref_name }}`
            **Build Result:** ${{ needs.build-game.result }}
            
            **Commit Message & Details:**
            ${{ github.event.head_commit.message }}
          EMBEDS: "true"
          RESULT: ${{ needs.build-game.result }}
