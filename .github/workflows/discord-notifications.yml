name: S.H.R.O.U.D Build Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  create:
  workflow_dispatch:

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Build Step
        run: echo "Compiling S.H.R.O.U.D game files..."

  send-notifications:
    runs-on: ubuntu-latest
    needs: build-game
    if: always()
    steps:
      - name: Checkout Full Code History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get list of changed files
      - name: Get Changed Files
        id: changed_files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.sha }} | head -n 10)
          elif [ "${{ github.event_name }}" = "push" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | head -n 10)
          else
            FILES=""
          fi

          if [ -z "$FILES" ]; then
            FILES="No files modified"
          else
            FILES=$(echo "$FILES" | awk '{print "• `" $0 "`"}')
          fi

          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Dispatch Discord Webhook
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_RESULT: ${{ needs.build-game.result }}
          
          # Event Details
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUM: ${{ github.event.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.list }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF: ${{ github.event.ref }}
        run: |
          cat << 'EOF' > notify.py
          import os
          import json
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK secret is missing or empty.")
              exit(1)

          event_name = os.environ.get("EVENT_NAME", "")
          action = os.environ.get("EVENT_ACTION", "")
          actor = os.environ.get("ACTOR", "Unknown")
          build_result = os.environ.get("BUILD_RESULT", "success")
          files = os.environ.get("CHANGED_FILES", "None")

          color = 3066993 if build_result == "success" else 15158332
          status_icon = "🟢" if build_result == "success" else "🔴"

          title = "S.H.R.O.U.D Notification"
          description = ""

          if event_name == "issue_comment" and os.environ.get("COMMENT_BODY"):
              pr_num = os.environ.get("PR_NUM", "")
              pr_title = os.environ.get("PR_TITLE", "")
              comment = os.environ.get("COMMENT_BODY", "")
              title = f"💬 New Comment on PR #{pr_num}"
              description = f"**Action Performed By:** {actor}\n**PR Title:** {pr_title}\n\n**Comment Content:**\n> {comment}"
              color = 3447003

          elif event_name == "pull_request":
              pr_num = os.environ.get("PR_NUM", "")
              pr_title = os.environ.get("PR_TITLE", "")
              pr_body = os.environ.get("PR_BODY") or "No description provided."
              title = f"🔀 PR {action.upper()}: #{pr_num}"
              description = f"**Action Performed By:** {actor}\n**PR Title:** {pr_title}\n**Build Status:** {build_result}\n\n**PR Description:**\n{pr_body}\n\n**Modified Files:**\n{files}"

          elif event_name == "create" and os.environ.get("REF_TYPE") == "branch":
              ref = os.environ.get("REF", "")
              title = f"🌱 New Branch Created: {ref}"
              description = f"**Action Performed By:** {actor}\n**Branch Name:** `{ref}`"
              color = 3066993

          elif event_name == "push":
              commit_msg = os.environ.get("COMMIT_MSG", "No commit message")
              commit_author = os.environ.get("COMMIT_AUTHOR", actor)
              branch = os.environ.get("REF_NAME", "")
              
              push_type = "Merged Pull Request" if "Merge pull request" in commit_msg else "Direct Commit Push"
              title = f"{status_icon} {push_type} on {branch}"
              description = f"**Action Performed By:** {actor}\n**Commit Author:** {commit_author}\n**Branch:** `{branch}`\n**Build Result:** {build_result}\n\n**Commit Details:**\n{commit_msg}\n\n**Modified Files:**\n{files}"

          else:
              title = f"⚙️ Pipeline Triggered ({event_name})"
              description = f"**Action Performed By:** {actor}\n**Build Result:** {build_result}"

          if len(description) > 4000:
              description = description[:3990] + "\n... (truncated)"

          payload = {
              "embeds": [{
                  "title": title,
                  "description": description,
                  "color": color
              }]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Webhook"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Notification sent successfully with status code {resp.status}")
          except Exception as e:
              print(f"Failed to send Discord notification: {e}")
              exit(1)
          EOF

          python3 notify.py
