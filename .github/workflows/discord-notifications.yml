name: S.H.R.O.U.D Build Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  create:
  workflow_dispatch:

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Build Step
        run: echo "Compiling S.H.R.O.U.D game files..."

  send-notifications:
    runs-on: ubuntu-latest
    needs: build-game
    # ONLY execute if a PR is opened, OR if a PR is closed and actually merged
    if: >
      github.event_name == 'pull_request' && 
      (github.event.action == 'opened' || (github.event.action == 'closed' && github.event.pull_request.merged == true))
    steps:
      - name: Checkout Full Code History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get list of changed files
      - name: Get Changed Files
        id: changed_files
        run: |
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...${{ github.sha }} | head -n 10)

          if [ -z "$FILES" ]; then
            FILES="No files modified"
          else
            FILES=$(echo "$FILES" | awk '{print "• `" $0 "`"}')
          fi

          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Dispatch Discord Webhook
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_MERGED: ${{ github.event.pull_request.merged }}
          ACTOR: ${{ github.actor }}
          BUILD_RESULT: ${{ needs.build-game.result }}
          
          # Event Details
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUM: ${{ github.event.number }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.list }}
        run: |
          cat << 'EOF' > notify.py
          import os
          import json
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook_url:
              print("ERROR: DISCORD_WEBHOOK secret is missing or empty.")
              exit(1)

          action = os.environ.get("EVENT_ACTION", "")
          is_merged = os.environ.get("IS_MERGED", "false") == "true"
          actor = os.environ.get("ACTOR", "Unknown")
          build_result = os.environ.get("BUILD_RESULT", "success")
          files = os.environ.get("CHANGED_FILES", "None")

          pr_num = os.environ.get("PR_NUM", "")
          pr_title = os.environ.get("PR_TITLE", "")
          pr_body = os.environ.get("PR_BODY") or "No description provided."

          # Setup layout defaults
          color = 3066993 if build_result == "success" else 15158332
          status_icon = "🟢" if build_result == "success" else "🔴"

          # Determine if Merged or Opened
          if action == "closed" and is_merged:
              title = f"🟣 PR MERGED: #{pr_num}"
              action_text = "Merged"
          else:
              title = f"🔀 PR OPENED: #{pr_num}"
              action_text = "Opened"

          description = (
              f"**Action:** PR {action_text}\n"
              f"**Action Performed By:** {actor}\n"
              f"**PR Title:** {pr_title}\n"
              f"**Build Status:** {status_icon} {build_result.upper()}\n\n"
              f"**PR Description:**\n{pr_body}\n\n"
              f"**Modified Files:**\n{files}"
          )

          if len(description) > 4000:
              description = description[:3990] + "\n... (truncated)"

          payload = {
              "embeds": [{
                  "title": title,
                  "description": description,
                  "color": color
              }]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Webhook"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Notification sent successfully with status code {resp.status}")
          except Exception as e:
              print(f"Failed to send Discord notification: {e}")
              exit(1)
          EOF

          python3 notify.py
