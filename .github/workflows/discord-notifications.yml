name: S.H.R.O.U.D Build Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  create:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Build Step
        run: echo "Compiling S.H.R.O.U.D game files..."

  send-notifications:
    runs-on: ubuntu-latest
    needs: build-game
    # UPDATED: Allows manual dispatches, PR opens, PR syncs, and Merged PRs to notify
    if: >
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'pull_request' && 
        (github.event.action == 'opened' || 
         github.event.action == 'synchronize' || 
         (github.event.action == 'closed' && github.event.pull_request.merged == true)))
    steps:
      - name: Checkout Full Code History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed_files
        run: |
          # Fallback SHAs if running outside of a pure PR context (like workflow_dispatch)
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            FILES="• \`Initial commit or manual run\`"
          else
            FILES=$(git diff --name-only $BASE_SHA...$HEAD_SHA | head -n 10)
            if [ -z "$FILES" ]; then
              FILES="No files modified"
            else
              FILES=$(echo "$FILES" | awk '{print "• `" $0 "`"}')
            fi
          fi

          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_MERGED: ${{ github.event.pull_request.merged }}
          ACTOR: ${{ github.actor }}
          BUILD_RESULT: ${{ needs.build-game.result }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual Trigger' }}
          PR_NUM: ${{ github.event.number || 'N/A' }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.list }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          cat << 'EOF' > notify.py
          import os
          import json
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not webhook_url:
              print("❌ ERROR: DISCORD_WEBHOOK secret is missing. If this is a fork, this is expected behavior.")
              exit(0) # Exit 0 so the whole pipeline doesn't look like a red failure due to a missing fork secret

          event_name = os.environ.get("EVENT_NAME", "")
          action = os.environ.get("EVENT_ACTION", "")
          is_merged = str(os.environ.get("IS_MERGED", "")).lower() == "true"
          actor = os.environ.get("ACTOR", "Unknown")
          build_result = os.environ.get("BUILD_RESULT", "success")
          files = os.environ.get("CHANGED_FILES", "None")

          pr_num = os.environ.get("PR_NUM", "")
          pr_title = os.environ.get("PR_TITLE", "")
          pr_body = os.environ.get("PR_BODY", "").strip() or "No description provided."

          color = 3066993 if build_result == "success" else 15158332
          status_icon = "🟢" if build_result == "success" else "🔴"

          # Determine Event Context for Titles
          if event_name == "workflow_dispatch":
              title = f"🚀 Manual Dispatch Pipeline Execution"
              action_text = "Manually Triggered"
          elif action == "closed" and is_merged:
              title = f"🟣 PR MERGED: #{pr_num}"
              action_text = "Merged"
          elif action == "synchronize":
              title = f"🔄 PR UPDATED: #{pr_num}"
              action_text = "New Commits Pushed"
          else:
              title = f"🔀 PR OPENED: #{pr_num}"
              action_text = "Opened"

          description = (
              f"**Action:** {action_text}\n"
              f"**Action Performed By:** {actor}\n"
              f"**Context Title:** {pr_title}\n"
              f"**Build Status:** {status_icon} {build_result.upper()}\n\n"
              f"**Description:**\n{pr_body}\n\n"
              f"**Modified Files:**\n{files}"
          )

          if len(description) > 4000:
              description = description[:3990] + "\n... (truncated)"

          payload = {
              "embeds": [{
                  "title": title,
                  "description": description,
                  "color": color
              }]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Webhook"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Notification sent successfully with status code {resp.status}")
          except Exception as e:
              print(f"Failed to send Discord notification: {e}")
              exit(1)
          EOF

          python3 notify.py
