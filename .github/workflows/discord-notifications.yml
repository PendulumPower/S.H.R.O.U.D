name: Test Discord Notification

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 👈 This enables the manual "Run workflow" test button

jobs:
  test-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Test Notification
        uses: niranjanshk27/discord-notify@main
        if: always()
        with:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: "🤖 Test Run for S.H.R.O.U.D"
          CONTENT: "If you see this, your Discord notification system is working perfectly!"
          EMBEDS: "true"
          RESULT: "success"
